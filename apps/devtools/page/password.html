<section>
	<h1>随机密码生成器</h1>
	<div>
		<form>
			<p><label for="median">密码位数：</label><input type="text" size="1" id="median" name="median" value="8" /></p>
			<p><label for="num">包含数字：</label><input type="checkbox" id="num" name="num" checked="checked" /></p>
			<p><label for="capital">大写字母：</label><input type="checkbox" id="capital" name="capital" checked="checked" /></p>
			<p><label for="lowercase">小写字母：</label><input type="checkbox" id="lowercase" name="lowercase" checked="checked" /></p>
			<p><label for="symbol">特殊符号：</label><input type="checkbox" id="symbol" name="symbol" /></p>
			<p><input type="text" size="16" id="outpd" name="outpd" value="" /><input type="submit" id="submit" value="生成密码" /></p>
		</form>
	</div>
	<footer>
		本工具由<a>罗杰</a>提供
	</footer>
</section>
