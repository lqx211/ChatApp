# ======================================================================
# ChatApp — Apache security hardening
# 拦截一切「不该被 Web 直接访问」的文件：VCS、虚拟环境、依赖目录、备份、
# 日志、文档、脚本、调试文件、私密数据目录（data/ 除 data/res 外全部）。
#
# 只拦截 HTTP 直连；PHP 的文件系统读取不受影响 —— api/file.php、
# api/avatar.php、api/emoji.php、升级/备份脚本等照常工作。
#
# 安装 / Install:
#   Linux (Debian/Ubuntu 容器):
#       sudo cp gh_apache_security.conf /etc/apache2/conf-available/chatapp-security.conf
#       sudo a2enconf chatapp-security && sudo systemctl reload apache2
#   macOS (Homebrew httpd):
#       把下面一行放进 ChatApp 的 <VirtualHost> 内：
#       Include "/Volumes/Server/ChatApp/gh_apache_security.conf"
# ======================================================================

# --- 1) 目录浏览一律关闭 ---
Options -Indexes

# --- 2) 敏感目录前缀（VCS / venv / 依赖 / 备份 / 开发调试 / 旧版模块）---
<LocationMatch "(?i)^/(\.git|\.svn|\.hg|\.venv|\.pnpm-store|\.vscode|\.idea|node_modules|bkup|backup|ws_test|tests|lab|cli|tablet|filedown/indexfiles)(/|$)">
    Require all denied
</LocationMatch>

# --- 3) 敏感文件后缀（数据库备份 / 日志 / 文档 / 脚本 / 配置 / 密钥）---
<LocationMatch "(?i)\.(sql|log|md|txt|sh|bash|zsh|conf|bak|old|orig|swp|swo|tar|tgz|tar\.gz|zip|yml|yaml|ini|env|pem|key|crt|p12|sqlite|db|pyc)$">
    Require all denied
</LocationMatch>

# --- 4) 根目录下的调试/临时文件（下划线开头：_inspect_msg.php、_test_*.php …）---
<LocationMatch "^/_">
    Require all denied
</LocationMatch>

# --- 5) 隐藏文件（.DS_Store / .gitignore / .htaccess …），保留 ACME .well-known ---
<LocationMatch "(^|/)\.(?!well-known/)[^/]*$">
    Require all denied
</LocationMatch>

# --- 6) 顺手挡掉的两个散落文件 ---
<LocationMatch "^/a$">
    Require all denied
</LocationMatch>

# --- 7) data/：一律禁止直连；仅 data/res（图标/表情/壁纸等静态资源）放行 ---
#     注意：以前只靠 data/.htaccess，而 AllowOverride None 时它完全不生效，
#     导致工单截图、闪传文件、附件、私密背景图可被直接下载（绕过 PHP 鉴权）。
<DirectoryMatch "^/Volumes/Server/ChatApp/data(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/Volumes/Server/ChatApp/data/res(/|$)">
    Require all granted
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/data(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/data/res(/|$)">
    Require all granted
</DirectoryMatch>

# --- 8) 友好错误页（容器里需要；macOS 的 vhost 已单独配置过同样的值）---
ErrorDocument 403 /errors/403.php
ErrorDocument 404 /errors/404.php
ErrorDocument 500 /errors/500.php
